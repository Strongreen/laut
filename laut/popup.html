<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laut</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="top">
      <div class="brand">
        <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <h1>Laut</h1>
      </div>
      <button id="contrast" class="hc-toggle" type="button" aria-pressed="false" title="Alto contraste: colore o texto da página em três tons (já lido, falta ler e palavra atual), com cores que se distinguem no daltonismo">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.4"/>
          <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
        </svg>
        <span>Alto contraste</span>
      </button>
    </div>
    <p id="status" role="status" aria-live="polite">Pronto para ler.</p>
  </header>

  <main>
    <section class="reads" aria-label="O que ler">
      <button id="readSel" class="tile" type="button">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 6h16M4 18h10" opacity=".45"/>
            <path d="M4 12h16" stroke-width="5"/>
          </svg>
        </span>
        <strong>Ler seleção</strong>
        <small id="selHint">Selecione um texto</small>
      </button>

      <button id="readPage" class="tile" type="button">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 3h8l4 4v14H6z"/>
            <path d="M9 12h6M9 16h6"/>
          </svg>
        </span>
        <strong>Ler página inteira</strong>
        <small>Todo o texto principal</small>
      </button>
    </section>

    <section class="player" aria-label="Controles de leitura">
      <div class="meta">
        <span id="progressText">Nada em leitura</span>
        <span id="remaining"></span>
      </div>
      <div class="progress"><i id="bar"></i></div>

      <div class="controls">
        <button id="stop" class="icon" type="button" title="Parar" aria-label="Parar" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>
        </button>

        <button id="back" class="icon skip" type="button" title="Voltar cerca de 10 segundos" aria-label="Voltar cerca de 10 segundos" disabled>
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5A8 8 0 1 1 4.5 10.5"/>
            <path d="M12 2 8.5 5 12 8"/>
            <text x="12" y="16.2" text-anchor="middle" font-size="7.6" font-weight="700" fill="currentColor" stroke="none" font-family="system-ui, sans-serif">10</text>
          </svg>
        </button>

        <button id="play" class="play" type="button" title="Ler" aria-label="Ler">
          <svg class="i-play" viewBox="0 0 24 24" width="26" height="26"><path d="M8.5 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" width="26" height="26"><rect x="6.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg>
        </button>

        <button id="fwd" class="icon skip" type="button" title="Avançar cerca de 10 segundos" aria-label="Avançar cerca de 10 segundos" disabled>
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <g transform="translate(24 0) scale(-1 1)">
              <path d="M12 5A8 8 0 1 1 4.5 10.5"/>
              <path d="M12 2 8.5 5 12 8"/>
            </g>
            <text x="12" y="16.2" text-anchor="middle" font-size="7.6" font-weight="700" fill="currentColor" stroke="none" font-family="system-ui, sans-serif">10</text>
          </svg>
        </button>

        <button id="speed" class="chip" type="button" title="Mudar a velocidade" aria-label="Velocidade">1×</button>
      </div>

      <label class="voice">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="3" width="6" height="11" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
        </svg>
        <select id="voice" aria-label="Voz"></select>
      </label>

      <label class="voice">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>
        </svg>
        <select id="translateTo" aria-label="Traduzir para"></select>
      </label>
      <p id="trNote" class="note" hidden></p>
      <button id="trDownload" class="download" type="button" hidden>Baixar idioma</button>
    </section>
  </main>

  <footer>
    <p class="keys"><kbd>Alt+Shift+L</kbd> seleção &nbsp; <kbd>Alt+Shift+P</kbd> página &nbsp; <kbd>Alt+Shift+S</kbd> parar</p>
    <p class="by">by <a href="https://www.strongreen.com" target="_blank" rel="noopener noreferrer">Ströngreen</a></p>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
